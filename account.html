<style>

.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--bd)}

.seg[data-m=month] .sind{transform:translateX(68px)}

<body>

<header><span class="lg"><img data-logo alt="Harihara Tea Factory logo"></span><span class="ttl">Tea Factory Accounts</span></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast" role="status"></div>
<dialog id="dlg"><form method="dialog"><h3></h3><p></p><input autocomplete="off"><div class="dact"><button type="button" class="gh cancel">Cancel</button><button type="submit" class="ok p">OK</button></div></form></dialog>

<script>
/* =========================================================
   HOSTINGER DATABASE CONNECTION
   ========================================================= */

let dbVersion = null;
let dbLoaded = false;
let dbSaving = false;
let dbDirty = false;
let saveTimer = null;
let currentSavePromise = null;

const dbStatus = message => {
    const el = document.getElementById('dbStatus');
    if (el) el.textContent = message;
};

const defaultData = () => ({
    suppliers:['Supplier 1'],
    price:{},
    fsup:['Firewood supplier 1'],
    fprice:{},
    workers:[],
    sp:[],
    leaf:[],
    fire:[],
    work:[],
    pay:[],
    bags:[],
    disp:[],
    waste:[],
    eb:[],
    svc:[],
    tools:[],
    notes:[],
    rem:[],
    oldStock:0
});

function normaliseData(data) {
    const defaults = defaultData();
    if (!data || typeof data !== 'object') return defaults;

    for (const key of Object.keys(defaults)) {
        if (data[key] === undefined || data[key] === null) {
            data[key] = defaults[key];
        }
    }

    return Object.assign(defaults, data);
}

async function apiRequest(url, options={}) {
    const response = await fetch(url, {
        credentials:'same-origin',
        ...options,
        headers:{
            ...(options.headers || {})
        }
    });

    if (response.status === 401) {
        notify('Your login session has expired. Please log in again.');
        setTimeout(() => { location.href = '/'; }, 1800);
        throw new Error('Not logged in');
    }

    return response;
}

async function loadFromServer(showMessage=true) {
    dbStatus('Connecting to database...');

    try {
        const response = await apiRequest('/api/data');

        if (!response.ok) {
            throw new Error('Server returned ' + response.status);
        }

        const result = await response.json();

        D = normaliseData(result.data);
        dbVersion = result.version ?? 0;
        dbLoaded = true;
        dbDirty = false;

        dbStatus('Connected to Hostinger database');

        if (typeof go === 'function') go(cur);

        if (showMessage) {
            notify('Data loaded successfully from the server.');
        }

        return true;
    } catch (error) {
        console.error(error);
        dbStatus('Database connection failed. Your data has not been saved.');
        if (showMessage) {
            notify('Could not load data from the server. Please check your connection and try again.');
        }
        return false;
    }
}

function save() {
    if (!dbLoaded) return;

    dbDirty = true;
    dbStatus('Changes waiting to be saved...');

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        saveToServer();
    }, 700);
}

async function saveToServer() {
    if (!dbLoaded) return false;

    if (dbSaving) {
        dbDirty = true;
        return currentSavePromise;
    }

    dbSaving = true;

    currentSavePromise = (async () => {
        try {
            while (dbDirty) {
                dbDirty = false;

                const snapshot = JSON.parse(JSON.stringify(D));

                const response = await apiRequest('/api/data', {
                    method:'PUT',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        data:snapshot,
                        version:dbVersion
                    })
                });

                if (response.status === 409) {
                    dbDirty = false;
                    dbStatus('Another computer changed the data. Loading the latest version...');

                    await loadFromServer(false);

                    notify(
                        'The data was changed from another computer. ' +
                        'The latest server data has been loaded. ' +
                        'Please check your changes before editing again.'
                    );

                    return false;
                }

                if (!response.ok) {
                    throw new Error('Save failed: ' + response.status);
                }

                const result = await response.json();

                if (result.version !== undefined) {
                    dbVersion = result.version;
                } else {
                    dbVersion = Number(dbVersion || 0) + 1;
                }
            }

            dbStatus('All changes saved to server at ' + new Date().toLocaleTimeString());
            return true;

        } catch (error) {
            console.error(error);
            dbStatus('Save failed. Check your internet connection.');
            return false;

        } finally {
            dbSaving = false;
        }
    })();

    return currentSavePromise;
}

async function manualSave() {
    clearTimeout(saveTimer);
    dbDirty = true;

    const success = await saveToServer();

    if (success) {
        notify('All changes saved to the Hostinger database!');
    }
}

/* =========================================================
   ORIGINAL APP DATA AND CALCULATIONS
   ========================================================= */

const T = () => {
    const d = new Date();
    return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,'0'),
        String(d.getDate()).padStart(2,'0')
    ].join('-');
};

const SD = () => D.selDate || T();

const dm = d => d && d.length >= 10
    ? d.slice(8,10)+d.slice(5,7)+d.slice(2,4)
    : (d || '');

let D = defaultData();

const n = v => parseFloat(v) || 0;
const f = (v,d=2) =>
    (Math.round(v*10**d)/10**d).toLocaleString('en-IN',{maximumFractionDigits:d});

const hrs = r => {
    if (!r.start || !r.end) return 0;
    let a = r.start.split(':');
    let b = r.end.split(':');
    let h = (b[0]*60 + +b[1] - a[0]*60 - +a[1]) / 60;
    return h < 0 ? h+24 : h;
};

const BAGS = ['HD Premium','Harihara Tea'];
const sum = (a,fn) => a.reduce((s,r)=>s+fn(r),0);

const sec = {
leaf:{
    t:'Green leaf',k:'leaf',
    F:[['d','Date','date'],['sup','Supplier','sel'],['kg','Weight (kg)','number']],
    C:[['Amount ₹',r=>f(n(r.kg)*n((D.price||{})[r.sup]))]]
},
fire:{
    t:'Firewood',k:'fire',
    F:[['d','Date','date'],['sup','Supplier','fsel'],['loaded','Loaded (kg)','number'],['empty','Empty (kg)','number']],
    C:[['Net kg',r=>f(n(r.loaded)-n(r.empty))],['Amount ₹',r=>f(fAmt(r))]]
},
work:{
    t:'Worker hours',k:'work',
    F:[['d','Date','date'],['name','Worker','wsel'],['start','Start','time'],['end','End','time']],
    C:[['Hours',r=>f(hrs(r))]]
},
pay:{
    t:'Staff payments',k:'pay',
    F:[['d','Date','date'],['name','Worker','wsel'],['amt','Amount ₹','number'],['note','Note','text']],
    C:[]
},
bags:{
    t:'Bag stock movements',k:'bags',
    F:[['d','Date','date'],['type','Bag','bag'],['rec','Received','number'],['used','Used','number']],
    C:[]
},
disp:{
    t:'Weekly dispatch',k:'disp',
    F:[['d','Date','date'],['mark','Bag mark','bag'],['kg','Dispatch (kg)','number']],
    C:[]
},
waste:{
    t:'Tea waste generated',k:'waste',
    F:[['d','Date','date'],['kg','Waste (kg)','number']],
    C:[]
},
eb:{
    t:'EB readings',k:'eb',
    F:[['d','Date','date'],['open','Opening unit','number'],['close','Closing unit','number'],['amt','Amount ₹','number']],
    C:[['Used',r=>f(n(r.close)-n(r.open))],['Next opening',r=>r.close]]
},
svc:{
    t:'Machine service',k:'svc',
    F:[['d','Date','date'],['desc','Machine / work','text'],['cost','Cost ₹','number']],
    C:[]
},
tools:{
    t:'M/C Tool',k:'tools',
    F:[['d','Date','date'],['name','Tool name','text'],['qty','Qty','number'],['price','Price ₹','number']],
    C:[['Total ₹',r=>f(n(r.qty)*n(r.price))]]
},
notes:{
    t:'Daily work update',k:'notes',
    F:[['d','Date','date'],['start','Company start','time'],['end','Company end','time'],['leaf','Green leaf used (kg)','number'],['rc','RC stock (kg)','number'],['bd','Breakdown','text']],
    C:[]
}
};

function wkStart(d) {
    const x = new Date(d+'T00:00');
    x.setDate(x.getDate()-((x.getDay()+1)%7));
    return [
        x.getFullYear(),
        String(x.getMonth()+1).padStart(2,'0'),
        String(x.getDate()).padStart(2,'0')
    ].join('-');
}

function form(s,extra='') {
    const inp = ([k,l,t]) => {
        const id = 'f_'+s.k+'_'+k;

        if (t==='sel') {
            return `<label>${l}<select id="${id}">${D.suppliers.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
        }

        if (t==='fsel'||t==='wsel') {
            return `<label>${l}<select id="${id}">${D[t==='fsel'?'fsup':'workers'].map(x=>`<option>${x}</option>`).join('')}</select></label>`;
        }

        if (t==='bag') {
            return `<label>${l}<select id="${id}">${BAGS.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
        }

        let v = t==='date' ? SD() :
            (s.k==='eb'&&k==='open'
                ? (D.eb.length ? D.eb[D.eb.length-1].close : 19167.83)
                : '');

        return `<label>${l}<input id="${id}" type="${t}" ${t==='number'?'step="any"':''} value="${v}"></label>`;
    };

    return `<form onsubmit="add(event,'${s.k}')">${s.F.map(inp).join('')}<button class="p">Add</button>${extra}</form>`;
}

function add(e,k) {
    e.preventDefault();
    const s = sec[k];
    const r = {};
    s.F.forEach(([f]) => r[f] = document.getElementById('f_'+k+'_'+f).value);
    D[k].push(r);
    save();
    go(cur);
}

function del(k,i) {
    D[k].splice(i,1);
    save();
    go(cur);
}

function table(s,rows) {
    rows = rows || D[s.k];
    const idx = D[s.k];

    return `<div class="tw"><table>
    <tr>${s.F.map(x=>`<th>${x[1]}</th>`).join('')}${s.C.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr>`+

const stat = (l,v) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;

function leafDay(d) {
    return sum(D.leaf.filter(r=>r.d===d),r=>n(r.kg));

function madeTeaAll() {
    return sum(D.leaf,r=>n(r.kg))/4;
}

function teaStock() {
    return n(D.oldStock)+madeTeaAll()-sum(D.disp,r=>n(r.kg));
}

function bagStock(t) {
    return sum(D.bags.filter(r=>r.type===t),r=>n(r.rec)-n(r.used));
}

function wbBuild() {
    const wb = XLSX.utils.book_new();

    for (const k in SH) {
        const rows = D[k].map(r=>{
            const o={};
            sec[k].F.forEach(([f,l])=>o[l]=r[f]??'');
            sec[k].C.forEach(([l,fn])=>o[l]=fn(r));
            return o;
        });

        XLSX.utils.book_append_sheet(
            wb,
            XLSX.utils.json_to_sheet(rows.length?rows:[{}]),
            SH[k]
        );
    }

    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([
        {key:'suppliers',value:JSON.stringify(D.suppliers)},
        {key:'oldStock',value:D.oldStock},
        {key:'rem',value:JSON.stringify(D.rem)},
        {key:'price',value:JSON.stringify(D.price)},
        {key:'fsup',value:JSON.stringify(D.fsup)},
        {key:'fprice',value:JSON.stringify(D.fprice)},
        {key:'workers',value:JSON.stringify(D.workers)},
        {key:'selDate',value:D.selDate||''}
    ]),'Settings');

    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(
        D.suppliers.map(s=>{
            const kg=sum(D.leaf.filter(r=>r.sup===s),r=>n(r.kg));
            const a=kg*n(D.price[s]);
            const p=sum(D.sp.filter(r=>r.sup===s),r=>n(r.amt));
            return {
                Supplier:s,
                'Price/kg':n(D.price[s]),
                'Total kg':kg,
                'Total amount':a,
                'Paid':p,
                'Balance':a-p
            };
        })
    ),'Suppliers');

    return wb;
}

function downloadExcel() {
    if (!window.XLSX) return notify('Excel library did not load. Check your internet connection.');
    XLSX.writeFile(wbBuild(),'TeaFactory.xlsx');
}

function importXls(file,q) {
    if (!file) return;

    const r = new FileReader();

    r.onload = async () => {
        try {
            const wb = XLSX.read(r.result,{type:'array'});

            for (const k in SH) {
                const ws = wb.Sheets[SH[k]];
                if (!ws) continue;

                D[k] = XLSX.utils.sheet_to_json(ws,{defval:''})
                    .filter(o=>Object.keys(o).length)
                    .map(o=>{
                        const x={};
                        sec[k].F.forEach(([f,l])=>x[f]=String(o[l]??''));
                        return x;
                    });
            }

            const st = wb.Sheets.Settings;

            if (st) {
                XLSX.utils.sheet_to_json(st).forEach(o=>{
                    try {
                        if(o.key==='suppliers')D.suppliers=JSON.parse(o.value);
                        if(o.key==='oldStock')D.oldStock=o.value;
                        if(o.key==='rem')D.rem=JSON.parse(o.value);
                        if(o.key==='price')D.price=JSON.parse(o.value);
                        if(o.key==='fsup')D.fsup=JSON.parse(o.value);
                        if(o.key==='fprice')D.fprice=JSON.parse(o.value);
                        if(o.key==='workers')D.workers=JSON.parse(o.value);
                        if(o.key==='selDate'&&o.value)D.selDate=o.value;
                    } catch(e) {}
                });
            }

            D = normaliseData(D);
            dbDirty = true;

            const success = await saveToServer();

            go(cur);

            if (success && !q) {
                notify('Excel data imported and saved to the server.');
            }
        } catch(e) {
            console.error(e);
            notify('Could not read this Excel file.');
        }
    };

    r.readAsArrayBuffer(file);
}

/* =========================================================
   JSON BACKUP AND RESTORE
   ========================================================= */

function downloadBackup() {
    const blob = new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'TeaFactory-Backup.json';
    a.click();
    URL.revokeObjectURL(url);
}

function restoreBackup(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = async () => {
        try {
            const restored = JSON.parse(reader.result);

            if (!restored || typeof restored !== 'object') {
                throw new Error('Invalid backup');
            }

            if (!(await askConfirm('Restore this backup? It will replace the current server data.','Restore',false))) {
                return;
            }

            D = normaliseData(restored);
            dbDirty = true;

            const success = await saveToServer();

            if (success) {
                go(cur);
                notify('Backup restored and saved to the server.');
            }
        } catch(e) {
            notify('Invalid backup file.');
        }
    };

    reader.readAsText(file);
}

async function lRen(L,i,recs,fld,pr) {
    const o=D[L][i];
    const x=await askText('Rename',o);

    if(!x||!x.trim()||x.trim()===o)return;

    const nn=x.trim();

    if(D[L].includes(nn))return notify('That name already exists');

    D[L][i]=nn;

    recs.forEach(k=>D[k].forEach(r=>{
        if(r[fld]===o)r[fld]=nn;
    }));

    if(pr&&D[pr][o]!==undefined) {
        D[pr][nn]=D[pr][o];
        delete D[pr][o];
    }

    save();
    go(cur);
}

async function lDel(L,i,recs,fld,pr) {
    const o=D[L][i];
    const c=sum(recs,k=>D[k].filter(r=>r[fld]===o).length);

    if(!await askConfirm('Delete "'+o+'"?'+(c?' '+c+' existing entries keep this name.':'')))return;

    D[L].splice(i,1);

    if(pr)delete D[pr][o];

    save();
    go(cur);
}

        const amt=kg*n(D.price[s]);

    });

function pie(items) {
    const tot=sum(items,x=>x.v);

    if(!tot)return '<p class="mu">No green leaf this month.</p>';

    let a=0,out='';

    items.forEach(x=>{
        if(!x.v)return;

        const fr=x.v/tot;

        if(fr>0.9999) {
            out+=`<circle cx="100" cy="100" r="90" fill="${x.c}"/>`;
            return;
        }

        const a2=a+fr*2*Math.PI;
        const p=t=>[100+90*Math.sin(t),100-90*Math.cos(t)];
        const [x1,y1]=p(a);
        const [x2,y2]=p(a2);

        out+=`<path d="M100 100L${x1} ${y1}A90 90 0 ${fr>.5?1:0} 1 ${x2} ${y2}Z" fill="${x.c}" stroke="rgba(255,255,255,.7)" stroke-width="2"/>`;
        a=a2;
    });

    return `<svg viewBox="0 0 200 200" width="210" height="210">${out}</svg>`;
}

async function renSup(i) {

    if(D.suppliers.includes(nn))return notify('That supplier already exists');

    D.suppliers[i]=nn;
    D.leaf.forEach(r=>{if(r.sup===o)r.sup=nn});
    D.sp.forEach(r=>{if(r.sup===o)r.sup=nn});

    if(D.price[o]!==undefined) {
        D.price[nn]=D.price[o];
        delete D.price[o];
    }

    save();
    go(cur);
}

async function delSup(i) {

let toastT;
function notify(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT=setTimeout(()=>t.classList.remove('show'),Math.min(7000,2200+String(msg).length*30));
}

function modal(o){
    return new Promise(res=>{
        const d=document.getElementById('dlg');
        d.querySelector('h3').textContent=o.title;
        const p=d.querySelector('p');
        p.textContent=o.msg||'';
        p.style.display=o.msg?'':'none';
        const i=d.querySelector('input');
        i.style.display=o.input?'':'none';
        i.value=o.val||'';
        const ok=d.querySelector('.ok');
        ok.textContent=o.ok||'OK';
        ok.className='ok '+(o.danger?'del':'p');
        let done=false;
        const fin=v=>{if(done)return;done=true;d.close();res(v)};
        d.querySelector('form').onsubmit=e=>{e.preventDefault();fin(o.input?i.value:true)};
        d.querySelector('.cancel').onclick=()=>fin(o.input?null:false);
        d.oncancel=e=>{e.preventDefault();fin(o.input?null:false)};
        d.showModal();
        if(o.input){i.focus();i.select();}
    });
}
const askText=(title,val='')=>modal({title,val,input:true,ok:'Save'});
const askConfirm=(msg,ok='Delete',danger=true)=>modal({title:'Please confirm',msg,ok,danger});

let chartMode='week';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ymd=x=>[x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-');

function chartData(){
    const sd=SD(),out=[];
    if(chartMode==='week'){
        for(let i=6;i>=0;i--){
            const x=new Date(sd+'T00:00');
            x.setDate(x.getDate()-i);
            out.push({l:DAY[x.getDay()],v:leafDay(ymd(x)),t:DAY[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]});
        }
    } else if(chartMode==='month'){
        const y=+sd.slice(0,4),m=+sd.slice(5,7),days=new Date(y,m,0).getDate();
        for(let d=1;d<=days;d++){
            const k=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
            out.push({l:String(d),v:leafDay(k),t:d+' '+MON[m-1]+' '+y});
        }
    } else {
        const y=sd.slice(0,4);
        for(let m=0;m<12;m++){
            const p=y+'-'+String(m+1).padStart(2,'0');
            out.push({l:MON[m],v:sum(D.leaf.filter(r=>r.d&&r.d.slice(0,7)===p),r=>n(r.kg)),t:MON[m]+' '+y});
        }
    }
    return out;
}

function chartBody(){
    const data=chartData();
    window._cd=data;
    const max=Math.max(...data.map(x=>x.v),1);
    const tot=sum(data,x=>x.v);
    const best=data.reduce((a,b)=>b.v>a.v?b:a,data[0]);
    const unit=chartMode==='year'?'month':'day';
    const title=chartMode==='week'?'last 7 days to '+dm(SD()):chartMode==='month'?MON[+SD().slice(5,7)-1]+' '+SD().slice(0,4):SD().slice(0,4);
    const showV=data.length<=12;
    return `<div class="csum">
        <div><b class="cu" data-v="${tot}">0</b>Total kg · ${title}</div>
        <div><b class="cu" data-v="${tot/data.length}">0</b>Average kg per ${unit}</div>
        <div><b>${tot?best.t:'-'}</b>${tot?'Best '+unit+' ('+f(best.v)+' kg)':'Best '+unit}</div>
    </div>
    <div class="bars">${data.map((x,i)=>{
        const p=x.v?Math.max(x.v/max*100,2):0;
        return `<div class="col${tot&&x===best?' best':''}" onclick="barInfo(${i},this)"><div class="bw">${showV&&x.v?`<span class="bv" style="bottom:calc(${p}% + 3px)">${f(x.v,0)}</span>`:''}<div class="bar" style="height:${p}%;--i:${i}"></div></div><div class="bl">${chartMode==='month'&&i%2?'':x.l}</div></div>`;
    }).join('')}</div>
    <p class="mu" id="cinfo">${tot?'Tap a bar to see its weight.':'No green leaf entries in this period yet.'}</p>`;
}

function leafChartCard(){
    const seg=['week','month','year'].map(m=>`<button class="${m===chartMode?'on':''}" onclick="setChart('${m}')">${m[0].toUpperCase()+m.slice(1)}</button>`).join('');
    return `<div class="card" id="chartCard"><div class="chead"><h3>Green leaf received</h3><div class="seg" data-m="${chartMode}"><i class="sind"></i>${seg}</div></div><div id="chartBody">${chartBody()}</div></div>`;
}

function setChart(m){
    chartMode=m;
    const c=document.getElementById('chartCard');
    c.querySelector('.seg').dataset.m=m;
    c.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===m));
    document.getElementById('chartBody').innerHTML=chartBody();
    runCounts();
}

function barInfo(i,el){
    const x=window._cd[i];
    document.getElementById('cinfo').innerHTML='<b>'+x.t+'</b> — '+f(x.v)+' kg';
    document.querySelectorAll('#chartCard .col').forEach(c=>c.classList.toggle('sel',c===el));
}

function runCounts(){
    document.querySelectorAll('.cu').forEach(el=>{
        const v=+el.dataset.v||0;
        if(matchMedia('(prefers-reduced-motion:reduce)').matches||!v){el.textContent=f(v);return;}
        const t0=performance.now();
        const step=t=>{
            const k=Math.min((t-t0)/900,1),e=1-Math.pow(1-k,3);
            el.textContent=f(v*e);
            if(k<1)requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    });
}

const ICON={Home:'🏠','Green leaf':'🍃',Firewood:'🪵',Workers:'👷',Bags:'🛍️','Tea stock':'📦','Tea waste':'♻️',EB:'⚡',Service:'🔧','M/C Tool':'🛠️',Note:'📝',Report:'📊'};

function addRem(e) {
    e.preventDefault();
    D.rem.push(rm.value);
    save();
    go('Home');
}

function go(p) {
    cur=p;

    nav.innerHTML='<div class="ind"></div>'+Object.keys(pages).map(k=>
        `<button class="${k===p?'on':''}" onclick="go('${k}')"><i>${ICON[k]||'•'}</i>${k}</button>`
    ).join('');

    const on=nav.querySelector('button.on'),ind=nav.querySelector('.ind');
    if(on&&ind){
        const pv=window.lastInd||{l:on.offsetLeft,w:on.offsetWidth};
        ind.style.transition='none';
        ind.style.left=pv.l+'px';
        ind.style.width=pv.w+'px';
        void ind.offsetWidth;
        ind.style.transition='';
        ind.style.left=on.offsetLeft+'px';
        ind.style.width=on.offsetWidth+'px';
        window.lastInd={l:on.offsetLeft,w:on.offsetWidth};
        nav.scrollLeft=on.offsetLeft-(nav.clientWidth-on.offsetWidth)/2;
    }
    const changed=window.lastPage!==p;
    window.lastPage=p;
    app.classList.remove('enter');
    app.innerHTML=pages[p]();
    if(changed){void app.offsetWidth;app.classList.add('enter');window.scrollTo({top:0,behavior:'smooth'});}
    runCounts();
}

const nav=document.getElementById('nav');
const app=document.getElementById('app');

go('Home');
loadFromServer(false);

</script>
