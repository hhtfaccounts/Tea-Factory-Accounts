<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tea Factory Accounts</title>
<style>
:root{color-scheme:dark;--bg1:#07170e;--bg2:#0c2a19;--b1:#1f7a4a;--b2:#6b5a1c;--b3:#14633a;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--tx:#e6eee4;--mu:#9fb3a3;--ac:#4fa361;--acl:#8fe0a0;--bd:rgba(255,255,255,.16);--sh:0 8px 32px rgba(0,0,0,.4);--card:rgba(30,45,34,.8);--bg:transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;position:relative}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.7;pointer-events:none}
body::before{width:380px;height:380px;background:var(--b1);top:-90px;left:-90px}
body::after{width:420px;height:420px;background:var(--b3);bottom:-120px;right:-100px}
header{padding:16px 18px 8px;font-size:22px;font-weight:650;color:var(--ac);letter-spacing:-.01em}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;max-width:760px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:6px;border-radius:30px;background:rgba(18,40,28,.55);border:1px solid var(--bd);box-shadow:0 10px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);scrollbar-width:none;scroll-behavior:smooth}
nav::-webkit-scrollbar{display:none}
nav .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:24px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 10px rgba(0,0,0,.25);transition:left .35s cubic-bezier(.3,1.2,.5,1),width .35s cubic-bezier(.3,1.2,.5,1);pointer-events:none}
nav button{position:relative;z-index:1;flex:0 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mu);padding:7px 10px;border-radius:24px;cursor:pointer;font:inherit;font-size:11px;white-space:nowrap;transition:color .2s}
nav button i{font-style:normal;font-size:20px;line-height:1.1;filter:grayscale(.5);transition:filter .2s,transform .2s}
nav button.on{color:var(--acl);font-weight:600}
nav button.on i{filter:none;transform:scale(1.12)}
main{padding:0 12px 120px;max-width:1000px;margin:auto}
.card,.stat{background:var(--glass);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
.card{padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px;border-radius:20px}
.stat b{display:block;font-size:22px;color:var(--ac)}
.stat span{color:var(--mu);font-size:12px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--glass2);color:var(--tx);font:inherit;min-width:110px;outline:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,107,58,.25)}
button.p{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0)),var(--ac);color:#fff;border:1px solid rgba(255,255,255,.3);padding:9px 16px;border-radius:999px;cursor:pointer;font:inherit;box-shadow:0 4px 14px rgba(47,107,58,.3),inset 0 1px 0 rgba(255,255,255,.4)}
button.p:active,.del:active{transform:scale(.97)}
button.x{background:none;border:0;color:#b33;cursor:pointer;font-size:16px}
.del{background:rgba(192,57,43,.88);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.del:hover{background:#a5301f}
.sm{padding:6px 12px!important}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-size:12px}
.mu{color:var(--mu);font-size:13px}
textarea{width:100%;min-height:90px}
#dbStatus{font-size:13px;color:var(--mu);margin-top:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>🍃 Tea Factory Accounts</header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
/* =========================================================
   HOSTINGER DATABASE CONNECTION
   ========================================================= */

let dbVersion = null;
let dbLoaded = false;
let dbSaving = false;
let dbDirty = false;
let saveTimer = null;
let currentSavePromise = null;

const dbStatus = message => {
    const el = document.getElementById('dbStatus');
    if (el) el.textContent = message;
};

const defaultData = () => ({
    suppliers:['Supplier 1'],
    price:{},
    fsup:['Firewood supplier 1'],
    fprice:{},
    workers:[],
    sp:[],
    leaf:[],
    fire:[],
    work:[],
    pay:[],
    bags:[],
    disp:[],
    waste:[],
    eb:[],
    svc:[],
    tools:[],
    notes:[],
    rem:[],
    oldStock:0
});

function normaliseData(data) {
    const defaults = defaultData();
    if (!data || typeof data !== 'object') return defaults;

    for (const key of Object.keys(defaults)) {
        if (data[key] === undefined || data[key] === null) {
            data[key] = defaults[key];
        }
    }

    return Object.assign(defaults, data);
}

async function apiRequest(url, options={}) {
    const response = await fetch(url, {
        credentials:'same-origin',
        ...options,
        headers:{
            ...(options.headers || {})
        }
    });

    if (response.status === 401) {
        alert('Your login session has expired. Please log in again.');
        location.href = '/';
        throw new Error('Not logged in');
    }

    return response;
}

async function loadFromServer(showMessage=true) {
    dbStatus('Connecting to database...');

    try {
        const response = await apiRequest('/api/data');

        if (!response.ok) {
            throw new Error('Server returned ' + response.status);
        }

        const result = await response.json();

        D = normaliseData(result.data);
        dbVersion = result.version ?? 0;
        dbLoaded = true;
        dbDirty = false;

        dbStatus('Connected to Hostinger database');

        if (typeof go === 'function') go(cur);

        if (showMessage) {
            alert('Data loaded successfully from the server.');
        }

        return true;
    } catch (error) {
        console.error(error);
        dbStatus('Database connection failed. Your data has not been saved.');
        if (showMessage) {
            alert('Could not load data from the server. Please check your connection and try again.');
        }
        return false;
    }
}

function save() {
    if (!dbLoaded) return;

    dbDirty = true;
    dbStatus('Changes waiting to be saved...');

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        saveToServer();
    }, 700);
}

async function saveToServer() {
    if (!dbLoaded) return false;

    if (dbSaving) {
        dbDirty = true;
        return currentSavePromise;
    }

    dbSaving = true;

    currentSavePromise = (async () => {
        try {
            while (dbDirty) {
                dbDirty = false;

                const snapshot = JSON.parse(JSON.stringify(D));

                const response = await apiRequest('/api/data', {
                    method:'PUT',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        data:snapshot,
                        version:dbVersion
                    })
                });

                if (response.status === 409) {
                    dbDirty = false;
                    dbStatus('Another computer changed the data. Loading the latest version...');

                    await loadFromServer(false);

                    alert(
                        'The data was changed from another computer. ' +
                        'The latest server data has been loaded. ' +
                        'Please check your changes before editing again.'
                    );

                    return false;
                }

                if (!response.ok) {
                    throw new Error('Save failed: ' + response.status);
                }

                const result = await response.json();

                if (result.version !== undefined) {
                    dbVersion = result.version;
                } else {
                    dbVersion = Number(dbVersion || 0) + 1;
                }
            }

            dbStatus('All changes saved to server at ' + new Date().toLocaleTimeString());
            return true;

        } catch (error) {
            console.error(error);
            dbStatus('Save failed. Check your internet connection.');
            return false;

        } finally {
            dbSaving = false;
        }
    })();

    return currentSavePromise;
}

async function manualSave() {
    clearTimeout(saveTimer);
    dbDirty = true;

    const success = await saveToServer();

    if (success) {
        alert('All changes saved to the Hostinger database!');
    }
}

/* =========================================================
   ORIGINAL APP DATA AND CALCULATIONS
   ========================================================= */

const T = () => {
    const d = new Date();
    return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,'0'),
        String(d.getDate()).padStart(2,'0')
    ].join('-');
};

const SD = () => D.selDate || T();

const dm = d => d && d.length >= 10
    ? d.slice(8,10)+d.slice(5,7)+d.slice(2,4)
    : (d || '');

let D = defaultData();

const n = v => parseFloat(v) || 0;
const f = (v,d=2) =>
    (Math.round(v*10**d)/10**d).toLocaleString('en-IN',{maximumFractionDigits:d});

const hrs = r => {
    if (!r.start || !r.end) return 0;
    let a = r.start.split(':');
    let b = r.end.split(':');
    let h = (b[0]*60 + +b[1] - a[0]*60 - +a[1]) / 60;
    return h < 0 ? h+24 : h;
};

const BAGS = ['HD Premium','Harihara Tea'];
const sum = (a,fn) => a.reduce((s,r)=>s+fn(r),0);

const sec = {
leaf:{
    t:'Green leaf',k:'leaf',
    F:[['d','Date','date'],['sup','Supplier','sel'],['kg','Weight (kg)','number']],
    C:[['Amount ₹',r=>f(n(r.kg)*n((D.price||{})[r.sup]))]]
},
fire:{
    t:'Firewood',k:'fire',
    F:[['d','Date','date'],['sup','Supplier','fsel'],['loaded','Loaded (kg)','number'],['empty','Empty (kg)','number']],
    C:[['Net kg',r=>f(n(r.loaded)-n(r.empty))],['Amount ₹',r=>f(fAmt(r))]]
},
work:{
    t:'Worker hours',k:'work',
    F:[['d','Date','date'],['name','Worker','wsel'],['start','Start','time'],['end','End','time']],
    C:[['Hours',r=>f(hrs(r))]]
},
pay:{
    t:'Staff payments',k:'pay',
    F:[['d','Date','date'],['name','Worker','wsel'],['amt','Amount ₹','number'],['note','Note','text']],
    C:[]
},
bags:{
    t:'Bag stock movements',k:'bags',
    F:[['d','Date','date'],['type','Bag','bag'],['rec','Received','number'],['used','Used','number']],
    C:[]
},
disp:{
    t:'Weekly dispatch',k:'disp',
    F:[['d','Date','date'],['mark','Bag mark','bag'],['kg','Dispatch (kg)','number']],
    C:[]
},
waste:{
    t:'Tea waste generated',k:'waste',
    F:[['d','Date','date'],['kg','Waste (kg)','number']],
    C:[]
},
eb:{
    t:'EB readings',k:'eb',
    F:[['d','Date','date'],['open','Opening unit','number'],['close','Closing unit','number'],['amt','Amount ₹','number']],
    C:[['Used',r=>f(n(r.close)-n(r.open))],['Next opening',r=>r.close]]
},
svc:{
    t:'Machine service',k:'svc',
    F:[['d','Date','date'],['desc','Machine / work','text'],['cost','Cost ₹','number']],
    C:[]
},
tools:{
    t:'M/C Tool',k:'tools',
    F:[['d','Date','date'],['name','Tool name','text'],['qty','Qty','number'],['price','Price ₹','number']],
    C:[['Total ₹',r=>f(n(r.qty)*n(r.price))]]
},
notes:{
    t:'Daily work update',k:'notes',
    F:[['d','Date','date'],['start','Company start','time'],['end','Company end','time'],['leaf','Green leaf used (kg)','number'],['rc','RC stock (kg)','number'],['bd','Breakdown','text']],
    C:[]
}
};

function wkStart(d) {
    const x = new Date(d+'T00:00');
    x.setDate(x.getDate()-((x.getDay()+1)%7));
    return [
        x.getFullYear(),
        String(x.getMonth()+1).padStart(2,'0'),
        String(x.getDate()).padStart(2,'0')
    ].join('-');
}

function form(s,extra='') {
    const inp = ([k,l,t]) => {
        const id = 'f_'+s.k+'_'+k;

        if (t==='sel') {
            return `<label>${l}<select id="${id}">${D.suppliers.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
        }

        if (t==='fsel'||t==='wsel') {
            return `<label>${l}<select id="${id}">${D[t==='fsel'?'fsup':'workers'].map(x=>`<option>${x}</option>`).join('')}</select></label>`;
        }

        if (t==='bag') {
            return `<label>${l}<select id="${id}">${BAGS.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
        }

        let v = t==='date' ? SD() :
            (s.k==='eb'&&k==='open'
                ? (D.eb.length ? D.eb[D.eb.length-1].close : 19167.83)
                : '');

        return `<label>${l}<input id="${id}" type="${t}" ${t==='number'?'step="any"':''} value="${v}"></label>`;
    };

    return `<form onsubmit="add(event,'${s.k}')">${s.F.map(inp).join('')}<button class="p">Add</button>${extra}</form>`;
}

function add(e,k) {
    e.preventDefault();
    const s = sec[k];
    const r = {};
    s.F.forEach(([f]) => r[f] = document.getElementById('f_'+k+'_'+f).value);
    D[k].push(r);
    save();
    go(cur);
}

function del(k,i) {
    D[k].splice(i,1);
    save();
    go(cur);
}

function table(s,rows) {
    rows = rows || D[s.k];
    const idx = D[s.k];

    return `<div class="tw"><table>
    <tr>${s.F.map(x=>`<th>${x[1]}</th>`).join('')}${s.C.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr>`+
    rows.slice().reverse().map(r=>{
        const i = idx.indexOf(r);
        return `<tr>${s.F.map(x=>`<td>${x[2]==='date'?dm(r[x[0]]):(r[x[0]]??'')}</td>`).join('')}${s.C.map(c=>`<td>${c[1](r)}</td>`).join('')}<td><button class="del" onclick="del('${s.k}',${i})">Delete</button></td></tr>`;
    }).join('')+
    `</table></div>`;
}

function block(k,extra,pre) {
    const s = sec[k];
    return `<div class="card"><h3>${s.t}</h3>${pre||''}${form(s,extra)}${table(s)}</div>`;
}

const stat = (l,v) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;

function leafDay(d) {
    return sum(D.leaf.filter(r=>r.d===d),r=>n(r.kg));
}

function madeTeaAll() {
    return sum(D.leaf,r=>n(r.kg))/4;
}

function teaStock() {
    return n(D.oldStock)+madeTeaAll()-sum(D.disp,r=>n(r.kg));
}

function bagStock(t) {
    return sum(D.bags.filter(r=>r.type===t),r=>n(r.rec)-n(r.used));
}

/* =========================================================
   APP PAGES
   ========================================================= */

const pages = {

Home() {
    const l = leafDay(SD());

    return `
    <div class="card">
        <h3>Working date</h3>
        <label>Date<input type="date" value="${SD()}" onchange="D.selDate=this.value;save();go('Home')"></label>
        <p class="mu">Selected: <b>${dm(SD())}</b> (DDMMYY). This date is used in every tab until you change it here.</p>
    </div>

    ${supCard()}

    <div class="grid">
        ${stat("Selected day's green leaf (kg)",f(l))}
        ${stat('Made tea 4:1 (kg)',f(l/4))}
        ${stat('Firewood needed (kg)',f(l/4))}
        ${stat('Workers today',new Set(D.work.filter(r=>r.d===SD()).map(r=>r.name)).size)}
        ${stat('Available tea stock (kg)',f(teaStock()))}
        ${BAGS.map(b=>stat(b+' bags',f(bagStock(b),0))).join('')}
    </div>

    <div class="card">
        <h3>Database connection</h3>
        <p class="mu">Your factory data is stored centrally in the Hostinger MySQL database. Changes are automatically saved and shared with other logged-in computers.</p>
        <p id="dbStatus">Connecting...</p>
        <button class="p" onclick="manualSave()">Save now</button>
        <button class="p" onclick="loadFromServer(true)">Reload server data</button>
    </div>

    <div class="card">
        <h3>Excel file</h3>
        <p class="mu">Download a copy of your factory accounts or import an Excel workbook. Imported data will replace the current records on the server.</p>
        <p>
            <button class="p" onclick="downloadExcel()">Download Excel</button>
            <label style="display:inline-flex">Load from Excel
                <input type="file" accept=".xlsx" onchange="importXls(this.files[0])">
            </label>
        </p>
    </div>

    <div class="card">
        <h3>JSON backup</h3>
        <p class="mu">Download a backup of all the current account data.</p>
        <button class="p" onclick="downloadBackup()">Download backup</button>
        <label style="display:inline-flex">Restore backup
            <input type="file" accept=".json" onchange="restoreBackup(this.files[0])">
        </label>
    </div>`;
},

'Green leaf'() {
    return block('leaf',`<button type="button" class="p" onclick="newSup()">+ Supplier</button>`)+`${supTable()}${dailyTable()}`;
},

Firewood() {
    return block('fire',`<button type="button" class="p" onclick="lAdd('fsup','New firewood supplier name')">+ Supplier</button>`)+fsupTable()+fdaily();
},

Workers() {
    const wk = {};
    D.work.forEach(r=>{
        const w = wkStart(r.d);
        (wk[w]=wk[w]||{});
        wk[w][r.name]=(wk[w][r.name]||0)+hrs(r);
    });

    const rows = Object.keys(wk).sort().reverse().map(w=>
        Object.entries(wk[w]).map(([nm,h])=>
            `<tr><td>${dm(w)}</td><td>${nm}</td><td>${f(h)}</td></tr>`
        ).join('')
    ).join('');

    return wkTable()+
        block('work',`<button type="button" class="p" onclick="lAdd('workers','New worker name')">+ Worker</button>`)+
        `<div class="card"><h3>Weekly hours (Sat–Fri)</h3><div class="tw"><table><tr><th>Week starting</th><th>Worker</th><th>Total hours</th></tr>${rows}</table></div></div>`+
        block('pay')+
        `<div class="card">Total paid: <b>₹${f(sum(D.pay,r=>n(r.amt)))}</b></div>`;
},

Bags() {
    return block('bags')+`<div class="grid">${BAGS.map(b=>stat(b+' in stock',f(bagStock(b),0))).join('')}</div>`;
},

'Tea stock'() {
    return `<div class="card"><h3>Old stock</h3>
    <label>Old stock (kg)<input type="number" step="any" value="${D.oldStock}" onchange="D.oldStock=this.value;save();go('Tea stock')"></label>
    <p class="mu">Made tea so far: ${f(madeTeaAll())} kg · Available: <b>${f(teaStock())} kg</b></p></div>`+
    block('disp')+
    `<div class="card"><h3>Dispatch by bag mark</h3>${BAGS.map(b=>`<div>${b}: <b>${f(sum(D.disp.filter(r=>r.mark===b),r=>n(r.kg)))} kg</b></div>`).join('')}</div>`;
},

'Tea waste'() {
    const m = T().slice(0,7);
    const prior = sum(D.waste.filter(r=>r.d.slice(0,7)<m),r=>n(r.kg));
    const current = sum(D.waste.filter(r=>r.d.slice(0,7)===m),r=>n(r.kg));
    const op = 1909+prior;

    return `<div class="grid">${stat('Opening (kg)',f(op))}${stat('Generated this month (kg)',f(current))}${stat('Next month opening (kg)',f(op+current))}</div>`+block('waste');
},

EB() {
    const l = D.eb[D.eb.length-1];
    return (l?`<div class="grid">${stat('Total used (units)',f(n(l.close)-n(l.open)))}${stat('Bill amount ₹',f(ebAmt(l)))}${stat('Next opening',l.close)}</div>`:'')+block('eb');
},

Service() {
    return block('svc')+`<div class="card">Total: <b>₹${f(sum(D.svc,r=>n(r.cost)))}</b></div>`;
},

'M/C Tool'() {
    return block('tools')+`<div class="card">Total: <b>₹${f(sum(D.tools,r=>n(r.qty)*n(r.price)))}</b></div>`;
},

Note() {
    return block('notes');
},

Report() {
    const I = (a,b) => r => r.d>=a&&r.d<=b;

    return rbox('leaf','Green leaf',(a,b)=>{
        const L=D.leaf.filter(I(a,b));
        return stat('Total (kg)',f(sum(L,r=>n(r.kg))))+
            stat('Made tea 4:1 (kg)',f(sum(L,r=>n(r.kg))/4));
    })+
    rbox('fire','Firewood',(a,b)=>{
        const F=D.fire.filter(I(a,b));
        return stat('Net (kg)',f(sum(F,r=>n(r.loaded)-n(r.empty))))+
            stat('Amount ₹',f(sum(F,fAmt)));
    })+
    rbox('rc','RC',(a,b)=>
        stat('RC (kg)',f(sum(D.notes.filter(I(a,b)),r=>n(r.rc))))
    )+
    rbox('eb','EB',(a,b)=>{
        const E=D.eb.filter(I(a,b));
        return stat('Units used',f(sum(E,r=>n(r.close)-n(r.open))))+
            stat('Bill ₹',f(sum(E,ebAmt)));
    })+
    rbox('lab','Labour',(a,b)=>
        stat('Hours',f(sum(D.work.filter(I(a,b)),hrs)))+
        stat('Paid ₹',f(sum(D.pay.filter(I(a,b)),r=>n(r.amt))))
    );
}
};

const SH = {
    leaf:'Green leaf',
    fire:'Firewood',
    work:'Workers',
    pay:'Payments',
    bags:'Bags',
    disp:'Dispatch',
    waste:'Tea waste',
    eb:'EB',
    svc:'Service',
    tools:'MC Tool',
    notes:'Note',
    sp:'Supplier paid'
};

sec.sp = {
    t:'Payments to suppliers',
    k:'sp',
    F:[['d','Date','date'],['sup','Supplier','sel'],['amt','Paid ₹','number']],
    C:[]
};

const COL = ['#2f6b3a','#e0a030','#3b7dd8','#c0504d','#8e5bb5','#2aa198','#d2691e','#7f8c8d'];

/* =========================================================
   EXCEL IMPORT AND EXPORT
   ========================================================= */

function wbBuild() {
    const wb = XLSX.utils.book_new();

    for (const k in SH) {
        const rows = D[k].map(r=>{
            const o={};
            sec[k].F.forEach(([f,l])=>o[l]=r[f]??'');
            sec[k].C.forEach(([l,fn])=>o[l]=fn(r));
            return o;
        });

        XLSX.utils.book_append_sheet(
            wb,
            XLSX.utils.json_to_sheet(rows.length?rows:[{}]),
            SH[k]
        );
    }

    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([
        {key:'suppliers',value:JSON.stringify(D.suppliers)},
        {key:'oldStock',value:D.oldStock},
        {key:'rem',value:JSON.stringify(D.rem)},
        {key:'price',value:JSON.stringify(D.price)},
        {key:'fsup',value:JSON.stringify(D.fsup)},
        {key:'fprice',value:JSON.stringify(D.fprice)},
        {key:'workers',value:JSON.stringify(D.workers)},
        {key:'selDate',value:D.selDate||''}
    ]),'Settings');

    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(
        D.suppliers.map(s=>{
            const kg=sum(D.leaf.filter(r=>r.sup===s),r=>n(r.kg));
            const a=kg*n(D.price[s]);
            const p=sum(D.sp.filter(r=>r.sup===s),r=>n(r.amt));
            return {
                Supplier:s,
                'Price/kg':n(D.price[s]),
                'Total kg':kg,
                'Total amount':a,
                'Paid':p,
                'Balance':a-p
            };
        })
    ),'Suppliers');

    return wb;
}

function downloadExcel() {
    if (!window.XLSX) return alert('Excel library did not load. Check your internet connection.');
    XLSX.writeFile(wbBuild(),'TeaFactory.xlsx');
}

function importXls(file,q) {
    if (!file) return;

    const r = new FileReader();

    r.onload = async () => {
        try {
            const wb = XLSX.read(r.result,{type:'array'});

            for (const k in SH) {
                const ws = wb.Sheets[SH[k]];
                if (!ws) continue;

                D[k] = XLSX.utils.sheet_to_json(ws,{defval:''})
                    .filter(o=>Object.keys(o).length)
                    .map(o=>{
                        const x={};
                        sec[k].F.forEach(([f,l])=>x[f]=String(o[l]??''));
                        return x;
                    });
            }

            const st = wb.Sheets.Settings;

            if (st) {
                XLSX.utils.sheet_to_json(st).forEach(o=>{
                    try {
                        if(o.key==='suppliers')D.suppliers=JSON.parse(o.value);
                        if(o.key==='oldStock')D.oldStock=o.value;
                        if(o.key==='rem')D.rem=JSON.parse(o.value);
                        if(o.key==='price')D.price=JSON.parse(o.value);
                        if(o.key==='fsup')D.fsup=JSON.parse(o.value);
                        if(o.key==='fprice')D.fprice=JSON.parse(o.value);
                        if(o.key==='workers')D.workers=JSON.parse(o.value);
                        if(o.key==='selDate'&&o.value)D.selDate=o.value;
                    } catch(e) {}
                });
            }

            D = normaliseData(D);
            dbDirty = true;

            const success = await saveToServer();

            go(cur);

            if (success && !q) {
                alert('Excel data imported and saved to the server.');
            }
        } catch(e) {
            console.error(e);
            alert('Could not read this Excel file.');
        }
    };

    r.readAsArrayBuffer(file);
}

/* =========================================================
   JSON BACKUP AND RESTORE
   ========================================================= */

function downloadBackup() {
    const blob = new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'TeaFactory-Backup.json';
    a.click();
    URL.revokeObjectURL(url);
}

function restoreBackup(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = async () => {
        try {
            const restored = JSON.parse(reader.result);

            if (!restored || typeof restored !== 'object') {
                throw new Error('Invalid backup');
            }

            if (!confirm('Restore this backup? It will replace the current server data.')) {
                return;
            }

            D = normaliseData(restored);
            dbDirty = true;

            const success = await saveToServer();

            if (success) {
                go(cur);
                alert('Backup restored and saved to the server.');
            }
        } catch(e) {
            alert('Invalid backup file.');
        }
    };

    reader.readAsText(file);
}

/* =========================================================
   REPORTS AND SUPPLIER FUNCTIONS
   ========================================================= */

const ebAmt = r =>
    r.amt!==undefined&&r.amt!==''
        ? n(r.amt)
        : (n(r.close)-n(r.open))*n(r.rate);

const fAmt = r =>
    (n(r.loaded)-n(r.empty))*n(D.fprice[r.sup]||r.price);

let RR = {};

const rg = k => RR[k] || [SD().slice(0,8)+'01',SD()];

function rdate(k,i,v) {
    RR[k]=rg(k).slice();
    RR[k][i]=v;
    go('Report');
}

function rbox(k,t,body) {
    const [a,b]=rg(k);

    return `<div class="card"><h3>${t}</h3>
    <div style="display:flex;flex-wrap:nowrap;gap:8px">
    <label style="flex:1;min-width:0">Start date<input type="date" style="min-width:0;width:100%" value="${a}" onchange="rdate('${k}',0,this.value)"></label>
    <label style="flex:1;min-width:0">End date<input type="date" style="min-width:0;width:100%" value="${b}" onchange="rdate('${k}',1,this.value)"></label>
    </div>
    <div class="grid" style="margin-top:10px">${body(a,b)}</div></div>`;
}

function lAdd(L,m) {
    const x=prompt(m);

    if(x&&x.trim()&&!D[L].includes(x.trim())) {
        D[L].push(x.trim());
        save();
        go(cur);
    }
}

function lRen(L,i,recs,fld,pr) {
    const o=D[L][i];
    const x=prompt('Rename',o);

    if(!x||!x.trim()||x.trim()===o)return;

    const nn=x.trim();

    if(D[L].includes(nn))return alert('That name already exists');

    D[L][i]=nn;

    recs.forEach(k=>D[k].forEach(r=>{
        if(r[fld]===o)r[fld]=nn;
    }));

    if(pr&&D[pr][o]!==undefined) {
        D[pr][nn]=D[pr][o];
        delete D[pr][o];
    }

    save();
    go(cur);
}

function lDel(L,i,recs,fld,pr) {
    const o=D[L][i];
    const c=sum(recs,k=>D[k].filter(r=>r[fld]===o).length);

    if(!confirm('Delete "'+o+'"?'+(c?' '+c+' existing entries keep this name.':'')))return;

    D[L].splice(i,1);

    if(pr)delete D[pr][o];

    save();
    go(cur);
}

function setFp(i,v) {
    D.fprice[D.fsup[i]]=v;
    save();
    go(cur);
}

function fsupTable() {
    return `<div class="card"><h3>Firewood suppliers</h3><div class="tw"><table>
    <tr><th>Supplier</th><th>Price/kg ₹</th><th>Net (kg)</th><th>Amount ₹</th><th>Actions</th></tr>
    ${D.fsup.map((s,i)=>{
        const F=D.fire.filter(r=>r.sup===s);

        return `<tr><td>${s}</td>
        <td><input type="number" step="any" style="min-width:80px;width:90px" value="${D.fprice[s]??''}" onchange="setFp(${i},this.value)"></td>
        <td>${f(sum(F,r=>n(r.loaded)-n(r.empty)))}</td>
        <td>${f(sum(F,fAmt))}</td>
        <td><button class="p sm" onclick="lRen('fsup',${i},['fire'],'sup','fprice')">Rename</button>
        <button class="del" onclick="lDel('fsup',${i},['fire'],'sup','fprice')">Delete</button></td></tr>`;
    }).join('')}
    </table></div></div>`;
}

function fdaily() {
    const ds=[...new Set(D.fire.map(r=>r.d))].sort().reverse();

    return `<div class="card"><h3>Daily firewood net total (kg)</h3><div class="tw"><table>
    <tr><th>Date</th><th>Net (kg)</th></tr>
    ${ds.map(d=>`<tr><td>${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(2,4)}</td><td><b>${f(sum(D.fire.filter(r=>r.d===d),r=>n(r.loaded)-n(r.empty)))}</b></td></tr>`).join('')}
    </table></div></div>`;
}

function wkTable() {
    return `<div class="card"><h3>Workers</h3><div class="tw"><table>
    <tr><th>Worker</th><th>Total hours</th><th>Paid ₹</th><th>Actions</th></tr>
    ${D.workers.map((w,i)=>`<tr><td>${w}</td>
    <td>${f(sum(D.work.filter(r=>r.name===w),hrs))}</td>
    <td>${f(sum(D.pay.filter(r=>r.name===w),r=>n(r.amt)))}</td>
    <td><button class="p sm" onclick="lRen('workers',${i},['work','pay'],'name')">Rename</button>
    <button class="del" onclick="lDel('workers',${i},['work','pay'],'name')">Delete</button></td></tr>`).join('')}
    </table></div>${D.workers.length?'':'<p class="mu">Add a worker with + Worker in the form below.</p>'}</div>`;
}

/* Suppliers table (Green leaf tab): "Amount ₹" column removed */
function supTable() {
    return `<div class="card"><h3>Suppliers</h3><div class="tw"><table>
    <tr><th>Supplier</th><th>Total (kg)</th><th>Actions</th></tr>
    ${D.suppliers.map((s,i)=>`<tr><td>${s}</td>
    <td>${f(sum(D.leaf.filter(r=>r.sup===s),r=>n(r.kg)))}</td>
    <td><button class="p sm" onclick="renSup(${i})">Rename</button>
    <button class="del" onclick="delSup(${i})">Delete</button></td></tr>`).join('')}
    </table></div></div>`;
}

function dailyTable() {
    const ds=[...new Set(D.leaf.map(r=>r.d))].sort().reverse();

    return `<div class="card"><h3>Daily green leaf total (kg)</h3><div class="tw"><table>
    <tr><th>Date</th><th>Total (kg)</th></tr>
    ${ds.map(d=>`<tr><td>${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(2,4)}</td><td><b>${f(leafDay(d))}</b></td></tr>`).join('')}
    </table></div></div>`;
}

function setPrice(i,v) {
    D.price[D.suppliers[i]]=v;
    save();
    go(cur);
}

function supMonth() {
    const m=SD().slice(0,7);

    return D.suppliers.map((s,i)=>{
        const kg=sum(D.leaf.filter(r=>r.sup===s&&r.d.slice(0,7)===m),r=>n(r.kg));
        const amt=kg*n(D.price[s]);

        return {s,kg,amt,c:COL[i%COL.length]};
    });
}

function pie(items) {
    const tot=sum(items,x=>x.v);

    if(!tot)return '<p class="mu">No green leaf this month.</p>';

    let a=0,out='';

    items.forEach(x=>{
        if(!x.v)return;

        const fr=x.v/tot;

        if(fr>0.9999) {
            out+=`<circle cx="100" cy="100" r="90" fill="${x.c}"/>`;
            return;
        }

        const a2=a+fr*2*Math.PI;
        const p=t=>[100+90*Math.sin(t),100-90*Math.cos(t)];
        const [x1,y1]=p(a);
        const [x2,y2]=p(a2);

        out+=`<path d="M100 100L${x1} ${y1}A90 90 0 ${fr>.5?1:0} 1 ${x2} ${y2}Z" fill="${x.c}" stroke="rgba(255,255,255,.7)" stroke-width="2"/>`;
        a=a2;
    });

    return `<svg viewBox="0 0 200 200" width="210" height="210">${out}</svg>`;
}

/* Home supplier card: payment entry form, Paid and Balance removed */
function supCard() {
    const R=supMonth();
    const m=SD().slice(0,7);
    const S=k=>sum(R,x=>x[k]);
    const tk=S('kg');

    return `<div class="card">
    <h3>Green leaf supply — ${m.slice(5,7)}/${m.slice(0,4)}</h3>
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
    <div>${pie(R.map(x=>({v:x.kg,c:x.c})))}</div>
    <div class="tw" style="flex:1;min-width:260px">
    <table>
    <tr><th>Supplier</th><th>kg</th><th>%</th><th>Amount ₹</th></tr>
    ${R.map(x=>`<tr>
    <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${x.c};margin-right:6px"></span>${x.s}</td>
    <td>${f(x.kg)}</td><td>${tk?f(x.kg/tk*100,1):0}%</td>
    <td>${f(x.amt)}</td>
    </tr>`).join('')}
    <tr><th>Total</th><th>${f(tk)}</th><th></th><th>${f(S('amt'))}</th></tr>
    </table></div></div>
    </div>`;
}

function renSup(i) {
    const o=D.suppliers[i];
    const s=prompt('Rename supplier',o);

    if(!s||!s.trim()||s.trim()===o)return;

    const nn=s.trim();

    if(D.suppliers.includes(nn))return alert('That supplier already exists');

    D.suppliers[i]=nn;
    D.leaf.forEach(r=>{if(r.sup===o)r.sup=nn});
    D.sp.forEach(r=>{if(r.sup===o)r.sup=nn});

    if(D.price[o]!==undefined) {
        D.price[nn]=D.price[o];
        delete D.price[o];
    }

    save();
    go(cur);
}

function delSup(i) {
    const o=D.suppliers[i];
    const c=D.leaf.filter(r=>r.sup===o).length;

    if(!confirm('Delete supplier "'+o+'"?'+(c?'\n'+c+' existing leaf entries keep this name and stay in the records.':'')))return;

    D.suppliers.splice(i,1);
    delete D.price[o];

    save();
    go(cur);
}

function newSup() {
    const s=prompt('New supplier name');

    if(s&&s.trim()) {
        D.suppliers.push(s.trim());
        save();
        go(cur);
    }
}

function lAddWorker() {
    lAdd('workers','New worker name');
}

const ICON={Home:'🏠','Green leaf':'🍃',Firewood:'🪵',Workers:'👷',Bags:'🛍️','Tea stock':'📦','Tea waste':'♻️',EB:'⚡',Service:'🔧','M/C Tool':'🛠️',Note:'📝',Report:'📊'};

function addRem(e) {
    e.preventDefault();
    D.rem.push(rm.value);
    save();
    go('Home');
}

function go(p) {
    cur=p;

    nav.innerHTML='<div class="ind"></div>'+Object.keys(pages).map(k=>
        `<button class="${k===p?'on':''}" onclick="go('${k}')"><i>${ICON[k]||'•'}</i>${k}</button>`
    ).join('');

    const on=nav.querySelector('button.on'),ind=nav.querySelector('.ind');
    if(on&&ind){
        const pv=window.lastInd||{l:on.offsetLeft,w:on.offsetWidth};
        ind.style.transition='none';
        ind.style.left=pv.l+'px';
        ind.style.width=pv.w+'px';
        void ind.offsetWidth;
        ind.style.transition='';
        ind.style.left=on.offsetLeft+'px';
        ind.style.width=on.offsetWidth+'px';
        window.lastInd={l:on.offsetLeft,w:on.offsetWidth};
        nav.scrollLeft=on.offsetLeft-(nav.clientWidth-on.offsetWidth)/2;
    }
    app.innerHTML=pages[p]();
}

const nav=document.getElementById('nav');
const app=document.getElementById('app');

go('Home');
loadFromServer(false);
